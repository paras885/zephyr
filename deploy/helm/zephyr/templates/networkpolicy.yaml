{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zephyr.fullname" . }}-ingress
  labels:
    {{- include "zephyr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zephyr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.namespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
