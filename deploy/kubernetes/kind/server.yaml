apiVersion: apps/v1
kind: Deployment
metadata:
  name: zephyr-server
  namespace: zephyr-test
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: zephyr-server
  template:
    metadata:
      labels:
        app: zephyr-server
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: zephyr-server
      containers:
        - name: zephyr-server
          image: zephyr:kind
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: zephyr-runtime
                  key: DATABASE_URL
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: zephyr-runtime
                  key: AMQP_URL
            - name: ZEPHYR_ENV
              value: development
            - name: ZEPHYR_DEV_STATIC_AUTH
              value: "true"
            - name: ZEPHYR_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zephyr-runtime
                  key: ZEPHYR_SERVER_TOKEN
            - name: ZEPHYR_HTTP_ADDR
              value: 0.0.0.0:8080
            - name: ZEPHYR_WORKFLOWS_DIR
              value: /app/workflows
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 45
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: zephyr-server
  namespace: zephyr-test
spec:
  type: ClusterIP
  selector:
    app: zephyr-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zephyr-server
  namespace: zephyr-test
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: zephyr-server
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zephyr-server-ingress
  namespace: zephyr-test
spec:
  podSelector:
    matchLabels:
      app: zephyr-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080