apiVersion: batch/v1
kind: Job
metadata:
  name: zephyr-migrate
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: zephyr:local
          imagePullPolicy: IfNotPresent
          args: ["-migrate-only"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: zephyr-runtime
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]